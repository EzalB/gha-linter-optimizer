name: GitHub Actions Linter and Optimizer

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, closed]

jobs:
  run-linter:
    name: GHA Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run GHA Linter
        id: gha-lint
        uses: ./  # Use local action
        with:
          path: ".github/workflows"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request && github.event.pull_request.number }}
        continue-on-error: true

      - name: Confirm SARIF exists
        run: |
          if [ ! -f gha-linter.sarif ]; then
            echo "❌ SARIF file missing. Linter likely failed."
            exit 1
          fi

      # Upload SARIF to GitHub Security
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gha-linter.sarif

      # Annotate PR with GitHub Summary (Checks Tab)
      - name: Add annotations to GitHub Checks Summary
        if: always()
        run: |
          echo "### 🔍 GHA Linter Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat gha-linter-summary.txt 2>/dev/null || echo "No summary available"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # Fail the job if linter reported issues > 0
      - name: Fail build if issues found
        if: always()
        run: |
          if [ -f issue_count.txt ]; then
            COUNT=$(cat issue_count.txt)
            echo "Issues found: $COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "❌ Failing because linter found issues"
              exit 1
            fi
          fi

